AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Housing Finder — Lambda + API Gateway HTTP API

Parameters:
  TflAppId:
    Type: String
    Default: ''
    Description: TfL Unified API app_id (optional; enables journey-based transit commute)
  TflAppKey:
    Type: String
    Default: ''
    Description: TfL Unified API app_key (optional)
    NoEcho: true

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Architectures:
      - arm64

Resources:
  HousingHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      CorsConfiguration:
        AllowOrigins:
          - http://localhost:5173
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - content-type
          - authorization

  HealthFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - lambda/health.ts
        # CJS so the Node 22 Lambda runtime loads the bundle without package.json "type": "module"
        Format: cjs
        Target: es2022
        Sourcemap: true
    Properties:
      CodeUri: ./
      Handler: lambda/health.handler
      Runtime: nodejs22.x
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref HousingHttpApi
            Path: /api/health
            Method: GET

  SearchAreasFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - lambda/search-areas.ts
        Format: cjs
        Target: es2022
        Sourcemap: true
    Properties:
      CodeUri: ./
      Handler: lambda/search-areas.handler
      Runtime: nodejs22.x
      Environment:
        Variables:
          TFL_APP_ID: !Ref TflAppId
          TFL_APP_KEY: !Ref TflAppKey
      Events:
        SearchAreas:
          Type: HttpApi
          Properties:
            ApiId: !Ref HousingHttpApi
            Path: /api/search-areas
            Method: POST

  GeocodeWorkplaceFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - lambda/geocode-workplace.ts
        Format: cjs
        Target: es2022
        Sourcemap: true
    Properties:
      CodeUri: ./
      Handler: lambda/geocode-workplace.handler
      Runtime: nodejs22.x
      Events:
        GeocodeWorkplace:
          Type: HttpApi
          Properties:
            ApiId: !Ref HousingHttpApi
            Path: /api/geocode-workplace
            Method: POST
