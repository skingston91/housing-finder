AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Housing Finder — Lambda + API Gateway HTTP API

Parameters:
  TflAppKey:
    Type: String
    Default: ''
    Description: TfL Unified API app_key only (optional; app_id is not used). Enables journey-based transit commute.
    NoEcho: true

  MapboxAccessToken:
    Type: String
    Default: ''
    Description: Optional Mapbox access token for workplace geocoding; when empty, Nominatim is used.
    NoEcho: true

  OrsApiKey:
    Type: String
    Default: ''
    Description: Optional OpenRouteService API key for driving/cycling/walking commute directions (transit still uses TfL).
    NoEcho: true

  SearchAreasRoutingStrict:
    Type: String
    Default: '0'
    AllowedValues:
      - '0'
      - '1'
    Description: >
      Only affects **sam local** (AWS_SAM_LOCAL). Deployed Lambdas always enforce routing keys for the selected commute mode.
      When '1' locally, POST /api/search-areas returns 400 if the mode needs TfL or OpenRouteService but the key is missing.
      When '0' locally (default), missing keys log a console warning and use straight-line fallback.

  CorsAdditionalOrigin:
    Type: String
    Default: ''
    Description: Optional extra browser origin allowed by API Gateway CORS (e.g. https://your-app.pages.dev). http://localhost:5173 is always allowed. Leave empty for local-only.

  ApiSecretsArn:
    Type: String
    Default: ''
    Description: >
      Optional Secrets Manager secret ARN. SecretString must be JSON with optional keys
      TFL_APP_KEY, ORS_API_KEY, MAPBOX_ACCESS_TOKEN. Plain Parameters above still win when non-empty.
      Leave empty to use only template Parameters / console env.

Conditions:
  HasCorsAdditionalOrigin: !Not [!Equals [!Ref CorsAdditionalOrigin, '']]
  HasApiSecretsArn: !Not [!Equals [!Ref ApiSecretsArn, '']]

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Architectures:
      - arm64

Resources:
  HousingHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      CorsConfiguration:
        AllowOrigins: !If
          - HasCorsAdditionalOrigin
          - - http://localhost:5173
            - !Ref CorsAdditionalOrigin
          - - http://localhost:5173
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - content-type
          - authorization

  HealthFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - lambda/health.ts
        # CJS so the Node 22 Lambda runtime loads the bundle without package.json "type": "module"
        Format: cjs
        Target: es2022
        Sourcemap: true
    Properties:
      CodeUri: ./
      Handler: lambda/health.handler
      Runtime: nodejs22.x
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref HousingHttpApi
            Path: /api/health
            Method: GET

  SearchAreasFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - lambda/search-areas.ts
        Format: cjs
        Target: es2022
        Sourcemap: true
    Properties:
      CodeUri: ./
      Handler: lambda/search-areas.handler
      Runtime: nodejs22.x
      # Transit + TfL is **one HTTP call per candidate** (serialized for fair use; see TFL_JOURNEY_MAX_CONCURRENT).
      # With up to 12 grid cells, crime months, and optional live UK HPI, **30s** often times out → API returns 502.
      Timeout: 120
      MemorySize: 512
      Environment:
        Variables:
          TFL_APP_KEY: !Ref TflAppKey
          ORS_API_KEY: !Ref OrsApiKey
          SEARCH_AREAS_ROUTING_STRICT: !Ref SearchAreasRoutingStrict
          UKHPI_LIVE: ''
          API_SECRETS_ARN: !Ref ApiSecretsArn
      Events:
        SearchAreas:
          Type: HttpApi
          Properties:
            ApiId: !Ref HousingHttpApi
            Path: /api/search-areas
            Method: POST

  GeocodeWorkplaceFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - lambda/geocode-workplace.ts
        Format: cjs
        Target: es2022
        Sourcemap: true
    Properties:
      CodeUri: ./
      Handler: lambda/geocode-workplace.handler
      Runtime: nodejs22.x
      Environment:
        Variables:
          MAPBOX_ACCESS_TOKEN: !Ref MapboxAccessToken
          GEOCODE_RATE_LIMIT_PER_MINUTE: '30'
          API_SECRETS_ARN: !Ref ApiSecretsArn
      Events:
        GeocodeWorkplace:
          Type: HttpApi
          Properties:
            ApiId: !Ref HousingHttpApi
            Path: /api/geocode-workplace
            Method: POST

  ApiSecretsReadPolicy:
    Type: AWS::IAM::Policy
    Condition: HasApiSecretsArn
    Properties:
      PolicyName: housing-finder-api-secrets-read
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: !Ref ApiSecretsArn
      Roles:
        - !Ref SearchAreasFunctionRole
        - !Ref GeocodeWorkplaceFunctionRole
