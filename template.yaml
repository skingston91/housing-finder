AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Housing Finder — Lambda + API Gateway HTTP API

Parameters:
  TflAppKey:
    Type: String
    Default: ''
    Description: TfL Unified API app_key only (optional; app_id is not used). Enables journey-based transit commute.
    NoEcho: true

  MapboxAccessToken:
    Type: String
    Default: ''
    Description: Optional Mapbox access token for workplace geocoding; when empty, Nominatim is used.
    NoEcho: true

  OrsApiKey:
    Type: String
    Default: ''
    Description: Optional OpenRouteService API key for driving/cycling/walking commute directions (transit still uses TfL).
    NoEcho: true

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Architectures:
      - arm64

Resources:
  HousingHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      CorsConfiguration:
        AllowOrigins:
          - http://localhost:5173
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - content-type
          - authorization

  HealthFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - lambda/health.ts
        # CJS so the Node 22 Lambda runtime loads the bundle without package.json "type": "module"
        Format: cjs
        Target: es2022
        Sourcemap: true
    Properties:
      CodeUri: ./
      Handler: lambda/health.handler
      Runtime: nodejs22.x
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref HousingHttpApi
            Path: /api/health
            Method: GET

  SearchAreasFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - lambda/search-areas.ts
        Format: cjs
        Target: es2022
        Sourcemap: true
    Properties:
      CodeUri: ./
      Handler: lambda/search-areas.handler
      Runtime: nodejs22.x
      Environment:
        Variables:
          TFL_APP_KEY: !Ref TflAppKey
          ORS_API_KEY: !Ref OrsApiKey
      Events:
        SearchAreas:
          Type: HttpApi
          Properties:
            ApiId: !Ref HousingHttpApi
            Path: /api/search-areas
            Method: POST

  GeocodeWorkplaceFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - lambda/geocode-workplace.ts
        Format: cjs
        Target: es2022
        Sourcemap: true
    Properties:
      CodeUri: ./
      Handler: lambda/geocode-workplace.handler
      Runtime: nodejs22.x
      Environment:
        Variables:
          MAPBOX_ACCESS_TOKEN: !Ref MapboxAccessToken
          GEOCODE_RATE_LIMIT_PER_MINUTE: '30'
      Events:
        GeocodeWorkplace:
          Type: HttpApi
          Properties:
            ApiId: !Ref HousingHttpApi
            Path: /api/geocode-workplace
            Method: POST
